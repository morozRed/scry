ill="#636363" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1 Overview</text><text x="109.2" y="31.5" fill="#935700" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">·5</text><text x="151.2" y="31.5" fill="#636363" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2 Ports</text><text x="218.4" y="31.5" fill="#935700" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">·1</text><text x="260.4" y="31.5" fill="#636363" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3 Agents</text><text x="336.0" y="31.5" fill="#935700" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">·4</text><text x="378.0" y="31.5" fill="#2f5fd0" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">4 Disk</text><text x="453.6" y="31.5" fill="#636363" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5 Worktrees</text><text x="554.4" y="31.5" fill="#935700" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">·4</text><text x="310.8" y="247.5" fill="#636363" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○</text><text x="336.0" y="247.5" fill="#0f0f0f" textLength="361.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">The Disk view is coming in a later version.</text><text x="252.0" y="283.5" fill="#636363" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">It will show free space, its trend and what can be reclaimed.</text><text x="252.0" y="301.5" fill="#636363" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The trend needs history, which the background recorder keeps.</text><text x="361.2" y="319.5" fill="#636363" textLength="285.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Start it with scry daemon install.</text><text x="8.4" y="715.5" fill="#2f5fd0" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">r</text><text x="25.2" y="715.5" fill="#636363" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">refresh</text><text x="109.2" y="715.5" fill="#2f5fd0" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">?</text><text x="126.0" y="715.5" fill="#636363" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">help</text><text x="184.8" y="715.5" fill="#2f5fd0" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">q</text><text x="201.6" y="715.5" fill="#636363" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">quit</text></g></svg>
