<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460"><style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;font-size:14px;white-space:pre}</style><rect width="700" height="460" rx="8" fill="#ffffff"/><g transform="translate(14 14)"><text x="8.4" y="13.5" fill="#0f0f0f" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">(</text><text x="16.8" y="13.5" fill="#2f5fd0" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▮</text><text x="25.2" y="13.5" fill="#0f0f0f" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">) SCRY</text><text x="100.8" y="13.5" fill="#636363" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Overview</text><text x="193.2" y="13.5" fill="#636363" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Ports</text><text x="260.4" y="13.5" fill="#2f5fd0" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">Agents</text><text x="336.0" y="13.5" fill="#636363" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Disk</text><text x="378.0" y="13.5" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1</text><text x="411.6" y="13.5" fill="#636363" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Worktrees</text><text x="495.6" y="13.5" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4</text><text x="0.0" y="31.5" fill="#c7c7c7" textLength="672.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────</text><text x="8.4" y="67.5" fill="#935700" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">AGENT SESSIONS</text><text x="201.6" y="157.5" fill="#636363" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○</text><text x="226.8" y="157.5" fill="#0f0f0f" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">No agent sessions are running.</text><text x="84.0" y="193.5" fill="#636363" textLength="504.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Scry recognises Claude Code, Codex, OpenCode and Gemini CLI.</text><text x="92.4" y="211.5" fill="#636363" textLength="487.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Their sessions appear here as they run, with what each one</text><text x="302.4" y="229.5" fill="#636363" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">started.</text><text x="75.6" y="247.5" fill="#636363" textLength="529.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">`scry hook install claude` makes Claude Code attribution exact.</text><text x="8.4" y="427.5" fill="#2f5fd0" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">r</text><text x="25.2" y="427.5" fill="#636363" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">refresh</text><text x="109.2" y="427.5" fill="#2f5fd0" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">^p</text><text x="134.4" y="427.5" fill="#636363" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">commands</text><text x="226.8" y="427.5" fill="#2f5fd0" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">?</text><text x="243.6" y="427.5" fill="#636363" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">help</text><text x="302.4" y="427.5" fill="#2f5fd0" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">q</text><text x="319.2" y="427.5" fill="#636363" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">quit</text></g></svg>
