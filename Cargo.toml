[workspace]
resolver = "3"
members = ["crates/scry-core", "crates/scry"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
scry-core = { path = "crates/scry-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
insta = "1"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
