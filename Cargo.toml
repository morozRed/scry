[workspace]
resolver = "3"
members = ["crates/scry-core", "crates/scry"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
authors = ["Grigory Moroz"]
repository = "https://github.com/morozRed/scry"
homepage = "https://github.com/morozRed/scry"
keywords = ["macos", "tui", "agents", "ports", "monitor"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
scry-core = { path = "crates/scry-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
insta = "1"
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = "0.30"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.3"
tachyonfx = { version = "0.25", default-features = false, features = ["std-duration"] }
tempfile = "3"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
